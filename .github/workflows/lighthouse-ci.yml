name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/flowtaris-ai

      - name: Build Next.js app
        run: npm run build
        working-directory: ./apps/flowtaris-ai
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}

      - name: Start preview server
        run: |
          npm run start &
          sleep 10
        working-directory: ./apps/flowtaris-ai
        env:
          PORT: 3000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/assessment
            http://localhost:3000/roi-calculator
            http://localhost:3000/cost-of-inaction
            http://localhost:3000/capabilities
            http://localhost:3000/case-studies
            http://localhost:3000/insights
            http://localhost:3000/about
            http://localhost:3000/contact
            http://localhost:3000/innovation-lab
            http://localhost:3000/platforms/netsuite
            http://localhost:3000/platforms/coupa
            http://localhost:3000/platforms/sap
            http://localhost:3000/platforms/workday
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/flowtaris-ai/.lighthouseci/
          retention-days: 7

  lighthouse-budget:
    name: Lighthouse Budget Check
    runs-on: ubuntu-latest
    needs: lighthouse
    steps:
      - name: Download Lighthouse reports
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports
          path: ./lighthouse-reports

      - name: Check budgets
        run: |
          echo "Checking Lighthouse budgets..."
          # The treosh/lighthouse-ci-action will fail the build if budgets aren't met
          # This step is just for explicit confirmation
          ls -la ./lighthouse-reports/
          echo "Budget check complete - see Lighthouse CI step for results"